<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Ghost Hunt AR</title>

    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- AR.JS -->
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- ==============================
         PANTALLA DE INICIO
    =============================== -->

    <div id="pantallaInicio" class="pantalla">

        <div class="tarjeta">

            <div class="fantasmaIcono">
                
            </div>

            <h1>GHOST HUNT AR</h1>

            <p>
                ¡Los fantasmas han escapado!
            </p>

            <p>
                Atrapa todos los que puedas
                antes de que termine el tiempo.
            </p>

            <div class="reglas">

                <span>60 segundos</span>

                <span>3 vidas</span>

                <span>+10 puntos</span>

            </div>

            <button id="botonJugar">
                JUGAR
            </button>

        </div>

    </div>


    <!-- ==============================
         HUD DEL JUEGO
    =============================== -->

    <div id="hud">

        <div class="hudItem">
            ⭐ <span id="puntos">0</span>
        </div>

        <div class="hudItem">
            ⏱️ <span id="tiempo">60</span>s
        </div>

        <div class="hudItem">
            <span id="vidas">❤️❤️❤️</span>
        </div>

    </div>


    <!-- CONTADOR DE ATRAPADOS -->

    <div id="contadorFantasmas">
        👻 Atrapados:
        <span id="atrapados">0</span>
    </div>


    <!-- MENSAJES -->

    <div id="mensaje">
        ¡Atrapa al fantasma!
    </div>


    <!-- ==============================
         GAME OVER
    =============================== -->

    <div id="pantallaGameOver" class="pantalla">

        <div class="tarjeta">

            <div class="fantasmaIcono">
                👻
            </div>

            <h1>GAME OVER</h1>

            <p class="textoFinal">
                Tu puntuación
            </p>

            <div id="puntuacionFinal">
                0
            </div>

            <div class="estadisticas">

                <div>
                    <strong id="fantasmasFinal">
                        0
                    </strong>

                    <span>
                        Fantasmas atrapados
                    </span>
                </div>

                <div>
                    <strong id="recordFinal">
                        0
                    </strong>

                    <span>
                        Récord
                    </span>
                </div>

            </div>

            <button id="botonReiniciar">
                JUGAR DE NUEVO
            </button>

        </div>

    </div>


    <!-- ==============================
         ESCENA AR
    =============================== -->

    <a-scene
        embedded

        vr-mode-ui="enabled: false"

        renderer="
            antialias: true;
            alpha: true;
        "

        cursor="rayOrigin: mouse"

        raycaster="
            objects: .fantasma
        "

        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
        "
    >


        <!-- ==========================
             FANTASMA
        =========================== -->

        <a-entity
            id="fantasma"
            class="fantasma"
            position="0 0 -3"
            visible="false"
        >

            <!-- MODELO COMPLETO -->

            <a-entity
                id="modeloFantasma"

                animation__flotar="
                    property: position;
                    from: 0 -0.08 0;
                    to: 0 0.08 0;
                    dir: alternate;
                    dur: 900;
                    loop: true;
                    easing: easeInOutSine;
                "

                animation__balanceo="
                    property: rotation;
                    from: 0 -18 -4;
                    to: 0 18 4;
                    dir: alternate;
                    dur: 1600;
                    loop: true;
                    easing: easeInOutSine;
                "
            >


                <!-- CUERPO -->

                <a-sphere
                    position="0 0.05 0"
                    radius="0.34"
                    scale="1 1.35 0.82"

                    material="
                        color: #F2EEFF;
                        roughness: 0.7;
                        emissive: #715CFF;
                        emissiveIntensity: 0.08;
                    "
                >
                </a-sphere>


                <!-- CABEZA -->

                <a-sphere
                    position="0 0.31 0"
                    radius="0.34"
                    scale="1 0.90 0.85"

                    material="
                        color: #F7F4FF;
                        roughness: 0.65;
                        emissive: #715CFF;
                        emissiveIntensity: 0.08;
                    "
                >
                </a-sphere>


                <!-- OJOS -->

                <a-sphere
                    position="-0.115 0.34 0.286"
                    radius="0.057"
                    scale="0.75 1.15 0.45"
                    color="#171126"
                >
                </a-sphere>

                <a-sphere
                    position="0.115 0.34 0.286"
                    radius="0.057"
                    scale="0.75 1.15 0.45"
                    color="#171126"
                >
                </a-sphere>


                <!-- BRILLO OJOS -->

                <a-sphere
                    position="-0.128 0.365 0.323"
                    radius="0.014"
                    color="#FFFFFF"
                >
                </a-sphere>

                <a-sphere
                    position="0.102 0.365 0.323"
                    radius="0.014"
                    color="#FFFFFF"
                >
                </a-sphere>


                <!-- BOCA -->

                <a-sphere
                    position="0 0.205 0.30"
                    radius="0.045"
                    scale="0.75 1 0.35"
                    color="#352944"
                >
                </a-sphere>


                <!-- MEJILLAS -->

                <a-sphere
                    position="-0.205 0.215 0.272"
                    radius="0.038"
                    scale="1.2 0.5 0.25"

                    material="
                        color: #FF8FC7;
                        opacity: 0.6;
                        transparent: true;
                    "
                >
                </a-sphere>

                <a-sphere
                    position="0.205 0.215 0.272"
                    radius="0.038"
                    scale="1.2 0.5 0.25"

                    material="
                        color: #FF8FC7;
                        opacity: 0.6;
                        transparent: true;
                    "
                >
                </a-sphere>


                <!-- BRAZO IZQUIERDO -->

                <a-sphere
                    position="-0.35 0.03 -0.01"
                    radius="0.13"
                    scale="1.6 0.55 0.60"
                    rotation="0 0 -30"

                    material="
                        color: #F2EEFF;
                        roughness: 0.7;
                    "
                >
                </a-sphere>


                <!-- BRAZO DERECHO -->

                <a-sphere
                    position="0.35 0.03 -0.01"
                    radius="0.13"
                    scale="1.6 0.55 0.60"
                    rotation="0 0 30"

                    material="
                        color: #F2EEFF;
                        roughness: 0.7;
                    "
                >
                </a-sphere>


                <!-- COLITA -->

                <a-sphere
                    position="-0.18 -0.32 0"
                    radius="0.145"
                    scale="1 1.35 0.75"

                    material="
                        color: #F2EEFF;
                        roughness: 0.7;
                    "
                >
                </a-sphere>

                <a-sphere
                    position="0 -0.37 0"
                    radius="0.15"
                    scale="1 1.45 0.75"

                    material="
                        color: #F2EEFF;
                        roughness: 0.7;
                    "
                >
                </a-sphere>

                <a-sphere
                    position="0.18 -0.32 0"
                    radius="0.145"
                    scale="1 1.35 0.75"

                    material="
                        color: #F2EEFF;
                        roughness: 0.7;
                    "
                >
                </a-sphere>


                <!-- LUZ DEL FANTASMA -->

                <a-light
                    type="point"
                    color="#9D8CFF"
                    intensity="0.4"
                    distance="2"
                    position="0 0 0.5"
                >
                </a-light>

            </a-entity>

        </a-entity>


        <!-- ILUMINACIÓN -->

        <a-light
            type="ambient"
            color="#FFFFFF"
            intensity="0.8"
        >
        </a-light>

        <a-light
            type="directional"
            color="#FFFFFF"
            intensity="0.8"
            position="-1 2 2"
        >
        </a-light>


        <!-- CÁMARA -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        >
        </a-camera>

    </a-scene>


    <script src="js/juego.js"></script>

</body>

</html>
